name: Build and Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: vars
        run: |
          set -euo pipefail
          image="$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "building ${image}:${tag}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed tag
        run: docker buildx imagetools inspect "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"

  deploy:
    name: deploy
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_TAG: ${{ needs.docker.outputs.tag }}
      IMAGE_REF: ${{ needs.docker.outputs.image }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      # 国内云主机直连 ghcr.io 慢，优先走加速源，按 digest 拉取（内容寻址，可校验）
      # 该仓库直连 ghcr.io 可用（实测 ~4-5 分钟冷拉），默认不走加速源；
      # 若某天直连变慢，用仓库变量 GHCR_MIRRORS 逗号分隔列出来即可。
      GHCR_MIRRORS: ${{ vars.GHCR_MIRRORS || '' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '82.156.234.84' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/kiro-reverse-api' }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'kiro-proxy' }}
      HOST_PORT: ${{ vars.HOST_PORT || '8080' }}
      PUID: ${{ vars.PUID || '0' }}
      PGID: ${{ vars.PGID || '0' }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: cred
        run: |
          set -euo pipefail
          if [[ -n "${SSH_KEY:-}" ]]; then
            method=key
          elif [[ -n "${SSH_PASSWORD:-}" ]]; then
            method=password
          else
            echo "::error::缺少部署凭据：请配置 Secrets DEPLOY_SSH_KEY（推荐）或 DEPLOY_SSH_PASSWORD"
            exit 1
          fi
          echo "method=${method}" >> "$GITHUB_OUTPUT"
          echo "HEALTH_URL=http://127.0.0.1:${HOST_PORT}/health" >> "$GITHUB_ENV"
          echo "deploy target: ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT} dir=${DEPLOY_DIR}"

      - name: Install sshpass
        if: steps.cred.outputs.method == 'password'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Upload compose and prepare data dir
        env:
          METHOD: ${{ steps.cred.outputs.method }}
        run: |
          set -euo pipefail
          CRED_DIR="${RUNNER_TEMP:-$HOME}"
          if [[ "${METHOD}" == "key" ]]; then
            KEY_FILE="${CRED_DIR}/kiro-deploy-key"
            printf '%s\n' "${SSH_KEY}" > "${KEY_FILE}"; chmod 600 "${KEY_FILE}"
            SSH=(ssh -i "${KEY_FILE}" -o IdentitiesOnly=yes)
          else
            PASS_FILE="${CRED_DIR}/kiro-deploy-pass"
            printf '%s' "${SSH_PASSWORD}" > "${PASS_FILE}"; chmod 600 "${PASS_FILE}"
            SSH=(sshpass -f "${PASS_FILE}" ssh)
          fi
          # 冷拉镜像要 4-5 分钟：加 keepalive，避免中间链路把长时间无交互的连接掐掉（曾以 exit 255 中断部署）
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}"
                -o ServerAliveInterval=15 -o ServerAliveCountMax=10)

          COMPOSE_B64="$(base64 < deploy/docker-compose.deploy.yml | tr -d '\n')"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- \
            "${DEPLOY_DIR}" "${COMPOSE_B64}" "${PUID}" "${PGID}" <<'REMOTE'
          set -euo pipefail
          RAW_DIR="$1"; B64="$2"; PUID="$3"; PGID="$4"
          DIR="${RAW_DIR/#\$HOME/$HOME}"; DIR="${DIR/#\~/$HOME}"
          mkdir -p "${DIR}"
          printf '%s' "${B64}" | base64 -d > "${DIR}/docker-compose.deploy.yml"
          chmod 644 "${DIR}/docker-compose.deploy.yml"

          if [[ "${EUID}" -eq 0 ]]; then SUDO=()
          elif sudo -n true >/dev/null 2>&1; then SUDO=(sudo -n)
          else SUDO=(); fi

          "${SUDO[@]}" mkdir -p "${DIR}/data"
          "${SUDO[@]}" chown -R "${PUID}:${PGID}" "${DIR}/data"

          ENV_FILE="${DIR}/.env"
          if [[ -f "${ENV_FILE}" ]] && grep -q '^ADMIN_PASSWORD=' "${ENV_FILE}"; then
            echo "==> .env 已存在 ADMIN_PASSWORD，保持不变"
          else
            printf 'ADMIN_PASSWORD=%s\n' "$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-16)" >> "${ENV_FILE}"
            chmod 600 "${ENV_FILE}"
            echo "==> 首次生成 ADMIN_PASSWORD（查看：cat ${DIR}/.env）"
          fi
          echo "==> compose 就绪：${DIR}"
          REMOTE

      - name: Rolling update container
        env:
          METHOD: ${{ steps.cred.outputs.method }}
        run: |
          set -euo pipefail
          CRED_DIR="${RUNNER_TEMP:-$HOME}"
          if [[ "${METHOD}" == "key" ]]; then
            KEY_FILE="${CRED_DIR}/kiro-deploy-key"
            printf '%s\n' "${SSH_KEY}" > "${KEY_FILE}"; chmod 600 "${KEY_FILE}"
            SSH=(ssh -i "${KEY_FILE}" -o IdentitiesOnly=yes)
          else
            PASS_FILE="${CRED_DIR}/kiro-deploy-pass"
            printf '%s' "${SSH_PASSWORD}" > "${PASS_FILE}"; chmod 600 "${PASS_FILE}"
            SSH=(sshpass -f "${PASS_FILE}" ssh)
          fi
          # 冷拉镜像要 4-5 分钟：加 keepalive，避免中间链路把长时间无交互的连接掐掉（曾以 exit 255 中断部署）
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}"
                -o ServerAliveInterval=15 -o ServerAliveCountMax=10)

          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- \
            "${IMAGE_REF}" "${DEPLOY_TAG}" "${IMAGE_DIGEST}" "${CONTAINER_NAME}" \
            "${DEPLOY_DIR}" "${HEALTH_URL}" "${HOST_PORT}" "${PUID}" "${PGID}" "${GHCR_MIRRORS:-}" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; TAG="$2"; DIGEST="$3"; CONTAINER="$4"; RAW_DIR="$5"; HEALTH="$6"
          HOST_PORT="$7"; PUID="$8"; PGID="$9"; MIRRORS="${10:-}"
          DIR="${RAW_DIR/#\$HOME/$HOME}"; DIR="${DIR/#\~/$HOME}"
          CANONICAL="${IMAGE}:${TAG}"
          REPO_PATH="${IMAGE#ghcr.io/}"

          if docker info >/dev/null 2>&1; then DOCKER=(docker)
          elif sudo -n true >/dev/null 2>&1; then DOCKER=(sudo -n docker)
          else echo "::error::无法访问 docker 且无免密 sudo"; exit 1; fi

          ENVV=("IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}"
                "HOST_PORT=${HOST_PORT}" "COMPOSE_PROJECT_NAME=${CONTAINER}"
                "PUID=${PUID}" "PGID=${PGID}")
          if [[ "${DOCKER[0]}" == "sudo" ]]; then RUN=(sudo -n env "${ENVV[@]}" docker)
          else RUN=(env "${ENVV[@]}" docker); fi

          candidates=()
          if [[ -n "${DIGEST}" ]]; then
            IFS=',' read -ra MS <<< "${MIRRORS}"
            for m in "${MS[@]}"; do
              m="$(printf '%s' "$m" | tr -d '[:space:]')"
              [[ -n "$m" ]] && candidates+=("${m}/${REPO_PATH}@${DIGEST}")
            done
            candidates+=("${IMAGE}@${DIGEST}")
          else
            candidates+=("${CANONICAL}")
          fi

          PULLED=""
          for ref in "${candidates[@]}"; do
            echo "==> docker pull ${ref}"
            # 冷拉 ghcr.io 实测 4-5 分钟，超时给足；镜像层已缓存时这一步是秒级。
            if timeout 600 "${RUN[@]}" pull "${ref}"; then PULLED="${ref}"; break; fi
            echo "    （该源失败，尝试下一个）"
          done
          if [[ -z "${PULLED}" ]]; then
            echo "::error::所有镜像源拉取失败；若 401 说明 GHCR 包为 private（仓库需 public 或配置登录）"
            exit 1
          fi
          "${RUN[@]}" tag "${PULLED}" "${CANONICAL}"

          cd "${DIR}"
          "${RUN[@]}" compose -f docker-compose.deploy.yml up -d --pull never --remove-orphans
          "${RUN[@]}" ps --filter "name=${CONTAINER}" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

          state="$("${RUN[@]}" inspect -f '{{.State.Status}}' "${CONTAINER}" 2>/dev/null || echo missing)"
          if [[ "${state}" != "running" ]]; then
            echo "::error::容器 ${CONTAINER} 状态=${state}"
            "${RUN[@]}" logs --tail 80 "${CONTAINER}" 2>&1 || true
            exit 1
          fi

          code=""
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${HEALTH}" || echo 000)"
            [[ "${code}" == "200" ]] && break
            echo "    健康检查 ${i}/10：HTTP ${code}，5s 后重试"
            sleep 5
          done
          echo "==> 健康检查 ${HEALTH} -> HTTP ${code}"
          if [[ "${code}" != "200" ]]; then
            echo "::error::健康检查未通过（HTTP ${code}）"
            "${RUN[@]}" logs --tail 80 "${CONTAINER}" 2>&1 || true
            exit 1
          fi

          "${RUN[@]}" image prune -f >/dev/null 2>&1 || true
          echo "部署完成：${CANONICAL}"
          REMOTE

      - name: Cleanup credentials
        if: always()
        run: |
          CRED_DIR="${RUNNER_TEMP:-$HOME}"
          rm -f "${CRED_DIR}/kiro-deploy-key" "${CRED_DIR}/kiro-deploy-pass"